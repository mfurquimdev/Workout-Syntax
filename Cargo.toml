[package]
name = "workout_syntax"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "wasm"]

[features]
# `native` (default): the language server loop (lsp-server), the sync
# server (std::net), the git-backed log store (std::process), and the
# workout-lsp and workout-server binaries. The WebAssembly build (wasm/)
# turns it off; the parser, tokens, merge and the editor analysis
# (lsp::analysis, lsp-types only) are always built.
default = ["native"]
native = ["dep:lsp-server"]

[[bin]]
name = "workout-lsp"
required-features = ["native"]

[[bin]]
name = "workout-server"
required-features = ["native"]

[[test]]
name = "lsp_server"
required-features = ["native"]

[[test]]
name = "sync"
required-features = ["native"]

[dependencies]
lsp-server = { version = "0.10.0", optional = true }
lsp-types = "0.97.0"
pest = "2.9.5"
pest_derive = "2.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Size-optimised release profile for the WebAssembly module (wasm/build.sh);
# native release builds keep the default `release` profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
